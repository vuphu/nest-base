name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm run lint

  e2e-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Copy env
        run: cp .env.example .env
      - name: Run test
        run: pnpm run test:e2e
